name: Build

# Builds only when asked: a manual run (with a version it also publishes the release) or a v* tag.
# Pushes do not build, so a release does not wait behind test builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Опубликовать релиз с этим тегом, например v1.0.0 (пусто — только сборка)"
        required: false
        default: ""

env:
  # The tag being released, if any; the apps get its number (v1.2.0 -> 1.2.0) as their version.
  RELEASE_TAG: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # One fixed signing key, so a new APK installs over the old one (and the in-app update
      # works). Without it Gradle signs with a fresh debug key on every run.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing key
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KEYSTORE="$RUNNER_TEMP/techteamvpn.keystore"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            # Fails here if the secret is not the expected keystore; the fingerprint is public.
            keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | grep -i "SHA-256"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: this APK will not install over earlier ones"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Version from the release tag
        if: env.RELEASE_TAG != ''
        run: echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build libXray.aar
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-libxray.sh android
      - name: Unit tests and APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TechTeamVPN-android
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    # Xcode 26 (the default on macOS 26) builds with the iOS 26 SDK, which gives the app Liquid Glass.
    runs-on: macos-26
    env:
      # Optional signing secrets; without them only the unsigned IPA is built.
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
      IOS_PROFILE_TUNNEL_BASE64: ${{ secrets.IOS_PROFILE_TUNNEL_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Version from the release tag
        if: env.RELEASE_TAG != ''
        run: echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build LibXray.xcframework
        run: scripts/build-libxray.sh ios
      - name: Generate Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen
      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive -project TechTeamVPN.xcodeproj -scheme TechTeamVPN \
            -destination 'generic/platform=iOS' -archivePath build/TechTeamVPN.xcarchive \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ${APP_VERSION:+MARKETING_VERSION=${APP_VERSION%%-*} APP_DISPLAY_VERSION=$APP_VERSION}
          mkdir -p build/Payload
          cp -R build/TechTeamVPN.xcarchive/Products/Applications/TechTeamVPN.app build/Payload/
          (cd build && zip -qry TechTeamVPN-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: TechTeamVPN-ios-unsigned
          path: ios/build/TechTeamVPN-unsigned.ipa
      - name: Signed IPA
        if: env.IOS_P12_BASE64 != ''
        working-directory: ios
        run: ../scripts/ci/ios-sign.sh
      - uses: actions/upload-artifact@v4
        if: env.IOS_P12_BASE64 != ''
        with:
          name: TechTeamVPN-ios-signed
          path: ios/build/TechTeamVPN.ipa
      # The shared logic is unit-tested on Android too; the simulator run is skipped for releases to save time.
      - name: Unit tests
        if: env.RELEASE_TAG == ''
        working-directory: ios
        run: |
          # Simulator names change with each Xcode, so take the first available iPhone.
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Testing on $DEVICE"
          xcodebuild test -project TechTeamVPN.xcodeproj -scheme TechTeamVPN \
            -destination "platform=iOS Simulator,name=$DEVICE" CODE_SIGNING_ALLOWED=NO

  windows:
    # WPF + WebView2 app (windows/), with xray.exe, wintun.dll for the tunnel mode and the trimmed geodata.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      XRAY_VERSION: v26.10.21
      WINTUN_VERSION: "0.14.1"
      MAPLIBRE_VERSION: "5.6.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Version from the release tag
        run: |
          V="${RELEASE_TAG#v}"
          echo "APP_VERSION=${V:-1.0.0}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=TechTeamVPN-${RELEASE_TAG:-dev}-windows.zip" >> "$GITHUB_ENV"
      - name: Unit tests
        run: dotnet test windows/TechTeamVPN.Core.Tests
      - name: MapLibre for the globe
        run: |
          mkdir -p windows/TechTeamVPN/Web/vendor
          curl -sSfL -o windows/TechTeamVPN/Web/vendor/maplibre-gl.js "https://unpkg.com/maplibre-gl@${MAPLIBRE_VERSION}/dist/maplibre-gl.js"
          curl -sSfL -o windows/TechTeamVPN/Web/vendor/maplibre-gl.css "https://unpkg.com/maplibre-gl@${MAPLIBRE_VERSION}/dist/maplibre-gl.css"
      - name: Publish
        run: |
          dotnet publish windows/TechTeamVPN/TechTeamVPN.csproj -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:AppVersion="$APP_VERSION" -o out
      - name: Xray, Wintun and geodata
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray
          Copy-Item xray/xray.exe out/
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun/wintun/bin/amd64/wintun.dll out/
          Copy-Item geodata/geoip.dat, geodata/geosite.dat out/
          Remove-Item out/*.pdb -ErrorAction SilentlyContinue
          Get-ChildItem out
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath "$env:ZIP_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: TechTeamVPN-windows
          path: ${{ env.ZIP_NAME }}

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    env:
      # A tag push names the release by the tag; a manual run creates the tag on the built commit.
      TAG: ${{ inputs.version || github.ref_name }}
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: TechTeamVPN-android
          path: android
      - uses: actions/download-artifact@v4
        with:
          name: TechTeamVPN-ios-unsigned
          path: ios
      - uses: actions/download-artifact@v4
        with:
          name: TechTeamVPN-windows
          path: windows
      - name: Name the files
        run: |
          cp windows/*.zip "TechTeamVPN-${TAG}-windows.zip"
          cp android/app-universal-debug.apk "TechTeamVPN-${TAG}.apk"
          cp ios/TechTeamVPN-unsigned.ipa "TechTeamVPN-${TAG}-unsigned.ipa"
      # A tag with a suffix (v1.2.0-beta.1) is a beta: published as a pre-release, which the apps'
      # update check never sees, since it asks GitHub for the latest full release.
      - name: Beta or release
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
            echo "TITLE=TechTeamVPN ${TAG} (бета)" >> "$GITHUB_ENV"
            echo "NOTE=**Бета-версия** для проверки. Приложение не предлагает её как обновление; когда выйдет релиз, бета сама предложит обновиться." >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
            echo "TITLE=TechTeamVPN ${TAG}" >> "$GITHUB_ENV"
            echo "NOTE=" >> "$GITHUB_ENV"
          fi
      # The "## <tag>" section of CHANGELOG.md, then how to install.
      - name: Release notes
        run: |
          {
            [ -n "$NOTE" ] && printf '%s\n\n' "$NOTE"
            echo "### Что нового"
            awk -v tag="## ${TAG}" '$0 == tag {on=1; next} /^## / {on=0} on' CHANGELOG.md | sed '/./,$!d'
            echo
            echo "### Установка"
            echo "- **Android:** \`TechTeamVPN-${TAG}.apk\` — установите файл на телефон (Android 8+)."
            echo "- **iOS:** \`TechTeamVPN-${TAG}-unsigned.ipa\` — неподписанный, подпишите своим сертификатом (нужны Network Extensions → Packet Tunnel)."
            echo "- **Windows:** \`TechTeamVPN-${TAG}-windows.zip\` — распакуйте в любую папку и запустите TechTeamVPN.exe (Windows 10/11)."
          } > notes.md
          if ! grep -qx "## ${TAG}" CHANGELOG.md; then echo "::warning::CHANGELOG.md has no section for ${TAG}"; fi
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TITLE }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: |
            TechTeamVPN-${{ env.TAG }}.apk
            TechTeamVPN-${{ env.TAG }}-unsigned.ipa
            TechTeamVPN-${{ env.TAG }}-windows.zip
          body_path: notes.md
