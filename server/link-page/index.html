<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechTeamVPN</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0B1020; color: #fff; font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { width: 100%; max-width: 420px; padding: 24px 16px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: #8A93B2; margin: 0 0 24px; }
  a.btn, button { display: block; width: 100%; box-sizing: border-box; padding: 15px; margin: 0 0 12px;
                  border: 0; border-radius: 14px; font: 600 16px system-ui; text-decoration: none; cursor: pointer; }
  .main { background: linear-gradient(135deg, #00D1FF, #7B5CFF); color: #fff; }
  .alt { background: #151B2E; color: #00D1FF; }
  small { color: #8A93B2; display: block; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h1>TechTeamVPN</h1>
  <p id="hint">Открываем приложение и добавляем вашу подписку…</p>
  <a class="btn main" id="open" href="#">Открыть в TechTeamVPN</a>
  <button class="alt" id="copy">Скопировать ссылку подписки</button>
  <a class="btn alt" href="https://github.com/cats1223/TechTeamVPN-app/releases/latest">Скачать приложение</a>
  <small>Если приложение не открылось само, нажмите «Открыть в TechTeamVPN».</small>
</main>
<script>
  // The bot links here as /?url=<url-encoded subscription>; Telegram buttons only allow http(s) links.
  var sub = new URLSearchParams(location.search).get("url") || "";
  var deep = "techteamvpn://add?url=" + encodeURIComponent(sub);
  var open = document.getElementById("open");
  if (!sub) {
    document.getElementById("hint").textContent = "В ссылке нет подписки.";
    open.style.display = "none";
    document.getElementById("copy").style.display = "none";
  } else {
    open.href = deep;
    setTimeout(function () { location.href = deep; }, 300);
  }
  // navigator.clipboard needs https; the page may be served over plain http, so fall back to execCommand.
  document.getElementById("copy").onclick = function () {
    var area = document.createElement("textarea");
    area.value = sub;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    document.body.removeChild(area);
    this.textContent = "Скопировано";
  };
</script>
</body>
</html>
